<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>MUSEUM PAPERBACKS</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500&family=Noto+Serif+JP:wght@400;500&family=Playfair+Display:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--bg:#EDEDEB;--fg:#2F3B33;--mute:#5f655f;--line:#d6d6d3;--ph:#e2e2df;--sh:rgba(20,25,22,.26)}
*{box-sizing:border-box;margin:0}
body{background:var(--bg);color:var(--fg);font-family:"Noto Serif JP",serif;-webkit-font-smoothing:antialiased}
.wrap{max-width:960px;margin:0 auto;padding:0 16px}
header{text-align:center;padding:64px 0 48px}
.logo{font:500 13px/1 Montserrat,sans-serif;letter-spacing:.32em;text-indent:.32em}
h1{font:400 clamp(20px,5.4vw,40px)/1.2 "Playfair Display",serif;letter-spacing:.2em;text-indent:.2em}
.sub{font:400 11px/1.6 Montserrat,sans-serif;letter-spacing:.22em;color:var(--mute);margin-top:18px;text-transform:uppercase}
.lead{font-size:13px;line-height:2.1;letter-spacing:.08em;color:var(--mute);margin:32px auto 0;max-width:30em}
h2{font:500 11px/1 Montserrat,sans-serif;letter-spacing:.28em;color:var(--mute);padding-bottom:14px;border-bottom:1px solid var(--line);margin:24px 0 28px}
ul{list-style:none;padding:0;display:grid;grid-template-columns:repeat(2,1fr);gap:36px 16px}
@media(min-width:720px){ul{grid-template-columns:repeat(3,1fr);gap:48px 32px}}
li a{display:block;color:inherit;text-decoration:none}
li img{display:block;width:100%;height:auto;aspect-ratio:128/182;box-shadow:0 1px 2px rgba(0,0,0,.08),0 10px 24px -12px var(--sh);transition:transform .35s ease,box-shadow .35s ease}
li a:hover img,li a:focus-visible img{transform:translateY(-4px);box-shadow:0 1px 2px rgba(0,0,0,.08),0 18px 30px -14px var(--sh)}
li a:focus-visible{outline:2px solid var(--fg);outline-offset:6px}
.jp{display:block;font-size:16px;letter-spacing:.18em;margin-top:18px}
.au{display:block;font-size:12px;letter-spacing:.14em;color:var(--mute);margin-top:6px}
.cta{display:inline-block;font:500 10px/1 Montserrat,"Noto Serif JP",sans-serif;letter-spacing:.2em;margin-top:14px;padding-bottom:5px;border-bottom:1px solid var(--fg)}
.cta i{font-style:normal;margin-left:.6em;display:inline-block;transition:transform .3s}
a:hover .cta i{transform:translateX(4px)}
.soon .ph{aspect-ratio:128/182;background:var(--ph);border:1px dashed var(--line);display:flex;align-items:center;justify-content:center;text-align:center;font:400 11px/1.9 Montserrat,sans-serif;letter-spacing:.3em;text-indent:.3em;color:var(--mute)}
.soon .jp,.soon .au{opacity:.7}
footer{text-align:center;padding:72px 0 56px;font:400 10px/1.8 Montserrat,sans-serif;letter-spacing:.2em;color:var(--mute)}
footer p+p{margin-top:6px;font-family:"Noto Serif JP",serif;letter-spacing:.08em}
</style></head><body><div class="wrap">
